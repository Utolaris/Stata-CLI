name: Compatibility

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "skill/stata-cli/bin/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

env:
  # Integration/e2e tests that need a real Stata installation skip themselves
  # when this is set. CI runners have no licensed Stata, so the Rust unit tests
  # and pure-frontend integration tests are what run here.
  SKIP_STATA_TESTS: "1"

jobs:

  rust-checks:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prefer rustup cargo shims (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $HOME ".cargo/bin")

      - name: Prefer rustup cargo shims (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-cli

      - name: Check Rust formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo fmt --manifest-path rust-cli/Cargo.toml --check

      - name: Check Rust formatting (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: cargo fmt --manifest-path rust-cli/Cargo.toml --check

      - name: Run Rust unit and integration tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --locked --manifest-path rust-cli/Cargo.toml

      - name: Run Clippy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo clippy --locked --manifest-path rust-cli/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit and integration tests (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: cargo test --locked --manifest-path rust-cli/Cargo.toml

      - name: Run Clippy (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: cargo clippy --locked --manifest-path rust-cli/Cargo.toml --all-targets -- -D warnings

      - name: Build native Rust CLI release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked --release --manifest-path rust-cli/Cargo.toml

      - name: Smoke-test native Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ".\rust-cli\target\release\stata-cli.exe" --help'

      - name: Build repo macOS binary (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: bash ./scripts/build_macos_bin.sh

      - name: Upload repo macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: stata-cli-macos
          path: skill/stata-cli/bin/stata-cli
          if-no-files-found: error
          retention-days: 14

      - name: Install Zig for Windows cross-build check (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: brew install zig

      - name: Install cargo-zigbuild (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: cargo install cargo-zigbuild --locked

      - name: Build repo Windows binary with zigbuild (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: bash ./scripts/build_windows_bin.sh

      - name: Upload zig-built Windows binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: stata-cli-windows-x86_64-gnu
          path: skill/stata-cli/bin/stata-cli.exe
          if-no-files-found: error
          retention-days: 14

  publish-binaries:
    name: Publish skill binaries
    if: github.event_name != 'pull_request'
    needs: rust-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: stata-cli-windows-x86_64-gnu
          path: artifacts/windows

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: stata-cli-macos
          path: artifacts/macos

      - name: Copy binaries into skill bin directory
        run: |
          cp artifacts/windows/stata-cli.exe skill/stata-cli/bin/stata-cli.exe
          cp artifacts/macos/stata-cli skill/stata-cli/bin/stata-cli
          chmod +x skill/stata-cli/bin/stata-cli skill/stata-cli/bin/stata-cli.exe

      - name: Commit refreshed binaries
        run: |
          if git diff --quiet skill/stata-cli/bin; then
            echo "Binaries unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "stata-cli-ci"
          git config user.email "stata-cli-ci@users.noreply.github.com"
          git add skill/stata-cli/bin/stata-cli skill/stata-cli/bin/stata-cli.exe
          git commit -m "build: refresh skill binaries from CI"
          git push

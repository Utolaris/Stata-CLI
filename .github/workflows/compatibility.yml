name: Compatibility

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

env:
  # Integration/e2e tests that need a real Stata installation skip themselves
  # when this is set. CI runners have no licensed Stata, so the Rust unit tests
  # and pure-frontend integration tests are what run here.
  SKIP_STATA_TESTS: "true"

jobs:

  rust-checks:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prefer rustup cargo shims (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $HOME ".cargo/bin")

      - name: Prefer rustup cargo shims (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-cli

      - name: Check Rust formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo fmt --manifest-path rust-cli/Cargo.toml --check

      - name: Check Rust formatting (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: cargo fmt --manifest-path rust-cli/Cargo.toml --check

      - name: Run Rust tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --manifest-path rust-cli/Cargo.toml --bins

      - name: Run Clippy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo clippy --manifest-path rust-cli/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: cargo test --manifest-path rust-cli/Cargo.toml --bins

      - name: Run Clippy (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: cargo clippy --manifest-path rust-cli/Cargo.toml --all-targets -- -D warnings

      - name: Build native Rust CLI release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --manifest-path rust-cli/Cargo.toml

      - name: Build repo macOS binary (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: bash ./scripts/build_macos_bin.sh

      - name: Run real scene smoke test (macOS zsh)
        if: runner.os == 'macOS' && env.SKIP_STATA_TESTS != 'true'
        shell: zsh {0}
        run: bash ./scripts/run_scene_smoke.sh

      - name: Install Zig for Windows cross-build check (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: brew install zig

      - name: Install cargo-zigbuild (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: cargo install cargo-zigbuild --locked

      - name: Build repo Windows binary with zigbuild (macOS zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: bash ./scripts/build_windows_bin.sh

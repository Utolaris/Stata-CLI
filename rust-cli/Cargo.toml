[package]
name = "stata-cli"
version = "1.0.1"
edition = "2021"
description = "A local Stata CLI for AI agents (native Rust engine, no Python)"

[dependencies]
anyhow = "1"
# Keep help/usage/error-context; drop color/suggestions (unused weight).
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
libloading = "0.8"
# Keep `\s`/`\d`/`\w`/`(?i)` working; drop unused `\p{...}` unicode tables.
regex = { version = "1", default-features = false, features = [
    "std",
    "perf",
    "unicode-perl",
    "unicode-case",
] }
# custom-bindings unused; file history is required by the REPL.
rustyline = { version = "14", default-features = false, features = [
    "with-file-history",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

# Size-oriented release profile for the skill-package binaries in
# `skill/stata-cli/bin/`. Trade-off is longer link time; runtime cost is
# acceptable for a local CLI that mostly drives Stata via FFI.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
# Unsafe is deliberately allowed for the single FFI boundary module
# (`src/atom/stata_engine.rs`) that loads Stata's shared library and calls its
# exported `StataSO_*` C ABI. The rationale is documented in that module and in
# README.md ("Unsafe FFI" section). It is kept at `warn` so new unsafe sites
# still surface in builds.
unsafe_code = "warn"
unused_must_use = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"
missing_const_for_fn = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
map_unwrap_or = "allow"
needless_raw_string_hashes = "allow"
single_char_pattern = "allow"
needless_pass_by_ref_mut = "allow"
option_if_let_else = "allow"
format_push_string = "allow"
redundant_closure_for_method_calls = "allow"
match_same_arms = "allow"
case_sensitive_file_extension_comparisons = "allow"
assigning_clones = "allow"
significant_drop_tightening = "allow"
significant_drop_in_scrutinee = "allow"
unnecessary_wraps = "allow"
needless_continue = "allow"
literal_string_with_formatting_args = "allow"

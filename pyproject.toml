[project]
name = "stata-cli"
version = "0.1.2"
description = "A Stata CLI for AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Utolaris"}
]
keywords = ["stata", "cli", "ai", "codex", "claude code"]

dependencies = [
    "fastapi>=0.119.0",
    "uvicorn>=0.38.0",
    "pydantic>=2.11.0",
    "pandas>=2.0.0",
    "httpx>=0.28.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
stata-cli-backend = "stata_cli.entry.backend_main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "stata_cli_backend",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stata_cli" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests that don't require Stata",
    "integration: Integration tests that require Stata installation",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",
    "B", "C4", "UP",
    "A", "ARG", "BLE", "ERA", "FA",
    "G", "LOG",
    "PERF", "PIE", "PT",
    "RET", "RSE", "RUF", "SIM", "TRY",
]
ignore = [
    "E501",
    "B008",
    "C901",
    "TRY003",
    "EM101",
    "EM102",
    "RET504",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "C4", "ARG", "PLR2004"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
]
